server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 32M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Route /api to Laravel PHP-FPM
    location /api {
        root /var/www/backend/public;
        try_files $uri /index.php$is_args$args;
    }

    # FastCGI handler for Laravel API
    location ~ \.php$ {
        root /var/www/backend/public;
        fastcgi_pass backend-api:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        include fastcgi_params;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Immutable static asset caching
    location ~* \.(?:css|js|woff2?|svg|gif|jpe?g|png)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # SPA history API fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
