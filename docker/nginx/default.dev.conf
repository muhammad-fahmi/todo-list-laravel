server {
    listen 80;
    server_name localhost;

    client_max_body_size 32M;

    # Route /api to Laravel PHP-FPM
    location /api {
        root /var/www/backend/public;
        try_files $uri /index.php$is_args$args;
    }

    # FastCGI handler for Laravel
    location ~ \.php$ {
        root /var/www/backend/public;
        fastcgi_pass backend-api:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        include fastcgi_params;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Route all other traffic to Vite React dev server with WebSocket HMR support
    location / {
        proxy_pass http://frontend-spa:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
