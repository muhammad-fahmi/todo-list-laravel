name: CI / CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend API Tests (Laravel 13 & PHP 8.4)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_sqlite, pdo_pgsql, pdo_mysql, bcmath, gd, zip
          coverage: none

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: apps/backend/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('apps/backend/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        working-directory: apps/backend
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Environment & Keys
        working-directory: apps/backend
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan jwt:secret --force

      - name: Execute Automated Test Suite
        working-directory: apps/backend
        run: php artisan test

  frontend-build:
    name: Frontend SPA Lint & Build (React 19 & TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install Dependencies
        working-directory: apps/frontend
        run: npm install

      - name: Run Linter
        working-directory: apps/frontend
        run: npm run lint

      - name: Typecheck & Production Build
        working-directory: apps/frontend
        run: npm run build

  docker-validation:
    name: Docker Compose Build Verification
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Compose Configurations
        run: |
          docker compose -f docker-compose.dev.yml config --quiet
          docker compose -f docker-compose.prod.yml config --quiet

      - name: Build Production Containers
        run: docker compose -f docker-compose.prod.yml build
